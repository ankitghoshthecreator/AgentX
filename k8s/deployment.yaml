apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-database-api
  namespace: default
  labels:
    app: agent-database
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-database
  template:
    metadata:
      labels:
        app: agent-database
    spec:
      containers:
      - name: api
        image: ankitghoshthecreator/agent-database:v2.0.0
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: ENVIRONMENT
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-database-service
  namespace: default
spec:
  selector:
    app: agent-database
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
